[project]
name = "disease-gene-explorer"
version = "0.2.0"
description = "Command-line explorer for Open Targets disease–gene associations."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Ishitta Sarkar" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["cache"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]

[tool.ruff.lint.per-file-ignores]
"main.py" = ["E402"]
